{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
  <!-- Центрируем форму авторизации по центру экрана.  Верхнее меню скрывается через hide_nav -->
  <!--
    Используем полный высотный flex-контейнер vh-100 для того, чтобы форма
    авторизации располагалась строго по центру страницы как по вертикали,
    так и по горизонтали. Класс min-vh-100 задаёт минимальную высоту,
    оставляя место для внутренних отступов базового шаблона. Здесь вместо
    min-vh-100 применён vh-100, что обеспечивает полный охват высоты
    видимой части экрана и гарантирует, что даже при отсутствии контента
    сверху/снизу форма не смещается. Классы d-flex, align-items-center и
    justify-content-center выравнивают форму по центру.
  -->
  <div class="d-flex align-items-center justify-content-center vh-100">
    <div style="max-width: 400px; width: 100%;">
      <!-- Логотип в верхней части формы -->
      <div class="mb-4 text-center">
        <img src="{{ url_for('static', filename='uploads/logo_moksli.png') }}" alt="Moksli logo" height="80">
      </div>
      <form method="post" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E‑mail</label>
          <input type="email" class="form-control" id="email" name="email" required>
          <div class="invalid-feedback">Введите e‑mail.</div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Пароль</label>
          <!-- Оборачиваем поле пароля в позиционирующий контейнер, чтобы разместить
               кнопку-переключатель в правой части ввода. Класс pe-5 добавляет
               правый внутренний отступ, чтобы текст не перекрывался с иконкой. -->
          <div class="position-relative">
            <input type="password" class="form-control pe-5" id="password" name="password" required>
            <!-- Кнопка для показа/скрытия пароля. Используем bg-transparent и border-0,
                 чтобы она выглядела как иконка без фона и границ. Располагаем
                 её по правому краю и центрируем по вертикали с помощью utilities
                 top-50 и translate-middle-y. -->
            <button type="button" class="position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0 bg-transparent"
                    id="togglePassword" aria-label="Показать/скрыть пароль" tabindex="-1">
              <!-- Иконка глаза. По умолчанию показываем закрытый глаз (пароль скрыт).
                   Класс text-primary окрашивает иконку в фирменный синий цвет, который
                   определяется в переменных темы. -->
              <i id="togglePasswordIcon" class="bi bi-eye-slash text-primary"></i>
            </button>
            <div class="invalid-feedback">Введите пароль.</div>
          </div>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Войти</button>
          <a href="#" class="btn btn-link p-0 text-decoration-none">Забыли пароль?</a>
        </div>
      </form>
    </div>
  </div>
  <!-- Скрипт для переключения видимости пароля. По клику на иконку глаза
       тип поля меняется с "password" на "text" и обратно, а сама иконка
       переключается между закрытым и открытым глазом. Оборачиваем
       обработчик в DOMContentLoaded, чтобы элементы существовали на момент
       назначения событий. -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var passwordInput = document.getElementById('password');
      var toggleBtn = document.getElementById('togglePassword');
      var toggleIcon = document.getElementById('togglePasswordIcon');
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function () {
          var isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          // Переключаем класс иконки между bi-eye и bi-eye-slash
          toggleIcon.classList.toggle('bi-eye');
          toggleIcon.classList.toggle('bi-eye-slash');
        });
      }
    });
  </script>
{% endblock %}
