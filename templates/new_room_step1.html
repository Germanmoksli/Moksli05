{% extends "base.html" %}

{% block title %}Новое объявление – Шаг 1{% endblock %}

{% block content %}
{% if hide_nav %}
  <!-- Панель управления: крестик и "В черновик". Фон прозрачный, элементы смещены вправо и немного вниз -->
  <div class="container-fluid mt-3">
    <div class="d-flex justify-content-end align-items-center gap-2">
      <!-- Кнопка закрытия: жирный крестик без фона -->
      <a href="{{ url_for('cancel_new_room') }}" class="d-flex align-items-center justify-content-center text-primary" style="text-decoration: none;">
        <i class="bi bi-x-lg fs-4 fw-bold"></i>
      </a>
      <!-- Кнопка сохранения в черновик: текст с первой заглавной, синий цвет и жирный шрифт -->
      <form action="{{ url_for('save_new_room_draft') }}" method="post" class="m-0">
        <button type="submit" class="btn btn-link fw-bold text-primary text-decoration-none p-0">
          В черновик
        </button>
      </form>
    </div>
  </div>
{% endif %}
<div class="container py-4">
  <h2 class="mb-4 text-primary fw-bold fs-4">Шаг 1: Выберите тип жилья</h2>
  <div class="row g-4">
    <!-- Option for a flat/apartment -->
    <div class="col-12 col-md-6">
      <form method="post">
        <input type="hidden" name="property_type" value="flat">
        <button type="submit" class="w-100 border-0 bg-transparent p-0">
          <div class="card text-center h-100 shadow-sm selectable-card {% if selected_type == 'flat' %}border-primary border-2{% endif %}">
            <div class="card-body py-4">
              <i class="bi bi-building fs-1 text-primary"></i>
              <h5 class="card-title mt-3 fw-bold">Квартира</h5>
              <p class="card-text">Жильё в многоквартирном доме</p>
            </div>
          </div>
        </button>
      </form>
    </div>
    <!-- Option for a house -->
    <div class="col-12 col-md-6">
      <form method="post">
        <input type="hidden" name="property_type" value="house">
        <button type="submit" class="w-100 border-0 bg-transparent p-0">
          <div class="card text-center h-100 shadow-sm selectable-card {% if selected_type == 'house' %}border-primary border-2{% endif %}">
            <div class="card-body py-4">
              <i class="bi bi-house fs-1 text-primary"></i>
              <h5 class="card-title mt-3 fw-bold">Дом</h5>
              <p class="card-text">Отдельно стоящий жилой дом</p>
            </div>
          </div>
        </button>
      </form>
    </div>
  </div>
  <!-- Progress and navigation -->
  <div class="d-flex align-items-center justify-content-between mt-4">
    {% if back_url %}
      <a href="{{ back_url }}" class="btn btn-link">Назад</a>
    {% else %}
      <span class="btn btn-link invisible">Назад</span>
    {% endif %}
    <div class="progress flex-grow-1 mx-3" style="height: 6px;">
      <div class="progress-bar bg-primary" role="progressbar" style="width: {{ progress }}%;" aria-valuenow="{{ progress }}" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    {% if next_url %}
      <a href="{{ next_url }}" class="btn btn-primary">Далее</a>
    {% else %}
      <span class="btn btn-primary disabled">Далее</span>
    {% endif %}
  </div>
</div>
{% endblock %}
