{% extends "Base.html" %}

{% block title %}Новое объявление – Шаг 4{% endblock %}

{% block content %}
{% if hide_nav %}
  <!-- Панель управления: кнопки расположены слева, с серым фоном как у меню навигации. -->
  <div class="container-fluid bg-light py-2 mb-3">
    <div class="d-flex align-items-center gap-2">
      <!-- Кнопка закрытия: жирный крестик на сером круглом фоне -->
      <a href="{{ url_for('cancel_new_room') }}" class="d-flex align-items-center justify-content-center rounded-circle" style="width: 40px; height: 40px; background-color: #f1f3f5; text-decoration: none;">
        <i class="bi bi-x-lg fs-4 fw-bold text-primary"></i>
      </a>
      <!-- Кнопка сохранения в черновик -->
      <form action="{{ url_for('save_new_room_draft') }}" method="post" class="m-0">
        <button type="submit" class="btn fw-bold text-primary" style="background-color: #f1f3f5; border: none; border-radius: 0.375rem; padding: 0.375rem 0.75rem;">
          В черновик
        </button>
      </form>
    </div>
  </div>
{% endif %}
<div class="container py-4">
  <h2 class="mb-4 text-primary fw-bold fs-4">Шаг 4: Удобства</h2>
  <form method="post">
    <!-- Styles for amenity cards -->
    <style>
      .amenity-card {
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        padding: 1rem;
        height: 100%;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      input[type=checkbox]:checked + .amenity-card {
        background-color: #f1f3f5;
      }
    </style>
    {% for category in categories %}
      <div class="mb-3">
        <h5 class="fw-bold mb-2">{{ category.name }}</h5>
        <div class="row g-2">
          {% for item in category.options %}
            <div class="col-6 col-md-4 col-lg-3">
              <label class="w-100">
                {#
                  The Jinja ``in`` operator will raise a TypeError if the
                  right‑hand operand is ``None``.  Use the ``default`` filter
                  to ensure that ``selected`` is an iterable (empty list) when
                  no amenities have been chosen yet.  Without this guard
                  selecting amenities in a new listing caused a 500 error when
                  ``session['new_listing_amenities']`` was not set.
                #}
                <input type="checkbox" name="amenities" value="{{ item.value }}" class="d-none" {% if item.value in (selected|default([])) %}checked{% endif %}>
                <div class="amenity-card text-center">
                  <i class="bi {{ item.icon }} fs-2 mb-2 text-primary"></i>
                  <div class="small fw-semibold">{{ item.label }}</div>
                </div>
              </label>
            </div>
          {% endfor %}
        </div>
      </div>
    {% endfor %}
    <!-- Progress and navigation bar -->
    <div class="d-flex align-items-center justify-content-between mt-4">
      <a href="{{ back_url }}" class="btn btn-link">Назад</a>
      <div class="progress flex-grow-1 mx-3" style="height: 6px;">
        <div class="progress-bar bg-primary" role="progressbar" style="width: {{ progress }}%;" aria-valuenow="{{ progress }}" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <button type="submit" class="btn btn-primary">Завершить</button>
    </div>
  </form>
</div>
{% endblock %}
