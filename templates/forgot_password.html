{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
  <!-- Страница восстановления пароля. Форма центрируется по
       вертикали и горизонтали, а навигация скрыта (hide_nav=True
       устанавливается в маршруте). -->
  <div class="d-flex align-items-center justify-content-center vh-100">
    <div style="max-width: 400px; width: 100%;">
      <!-- Логотип вверху -->
      <div class="mb-4 text-center">
        <img src="{{ url_for('static', filename='uploads/logo_moksli.png') }}" alt="Moksli logo" height="80">
      </div>
      <form id="reset-form" action="{{ url_for('reset_password') }}" method="post" class="needs-validation" novalidate>
        <!-- Ввод e-mail -->
        <div class="mb-3">
          <label for="reset_email" class="form-label">E‑mail</label>
          <input type="email" class="form-control" id="reset_email" name="email" required>
          <div class="invalid-feedback">Введите e‑mail.</div>
        </div>
        <!-- Ввод кода подтверждения, скрыт до отправки кода -->
        <div class="mb-3" id="reset-code-group" style="display: none;">
          <label for="reset_code" class="form-label">Код подтверждения</label>
          <input type="text" pattern="\d{6}" class="form-control" id="reset_code" name="verification_code" placeholder="000000">
          <div class="invalid-feedback">Введите 6‑значный код.</div>
        </div>
        <!-- Ввод нового пароля, скрыт до успешной проверки кода -->
        <div class="mb-3" id="new-pass-group" style="display: none;">
          <label for="new_password" class="form-label">Новый пароль</label>
          <input type="password" class="form-control" id="new_password" name="new_password">
          <div class="invalid-feedback">Введите новый пароль.</div>
        </div>
        <!-- Кнопки управления процессом: отправка кода, подтверждение и сохранение пароля -->
        <div class="d-flex justify-content-center align-items-center gap-2">
          <button type="button" class="btn btn-secondary" id="reset-send-code-btn">Отправить код</button>
          <button type="button" class="btn btn-primary" id="reset-verify-btn" style="display: none;">Подтвердить код</button>
          <button type="submit" class="btn btn-primary" id="reset-save-btn" style="display: none;">Сохранить пароль</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Скрипт для отправки кода, проверки кода и отображения нового пароля -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const sendBtn = document.getElementById('reset-send-code-btn');
      const emailInput = document.getElementById('reset_email');
      const codeGroup = document.getElementById('reset-code-group');
      const verifyBtn = document.getElementById('reset-verify-btn');
      const newPassGroup = document.getElementById('new-pass-group');
      const saveBtn = document.getElementById('reset-save-btn');
      const codeInput = document.getElementById('reset_code');

      // Отправка кода восстановления
      sendBtn.addEventListener('click', function () {
        const email = emailInput.value.trim();
        if (!email) {
          alert('Введите e‑mail.');
          return;
        }
        const url = "{{ url_for('send_reset_password_code') }}";
        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        })
        .then(async resp => {
          let data;
          try {
            data = await resp.json();
          } catch (_) {
            throw new Error('Непредвиденный ответ от сервера');
          }
          if (!resp.ok) {
            throw new Error(data.message || 'Не удалось отправить код.');
          }
          return data;
        })
        .then(data => {
          if (data.success) {
            alert('Код отправлен на ваш e‑mail.');
            codeGroup.style.display = '';
            verifyBtn.style.display = '';
            // При необходимости можно временно отключить кнопку отправки
            // sendBtn.disabled = true;
          } else {
            alert(data.message || 'Не удалось отправить код.');
          }
        })
        .catch((err) => {
          alert(err.message || 'Ошибка отправки запроса.');
        });
      });

      // Проверка кода восстановления
      verifyBtn.addEventListener('click', function () {
        const code = codeInput.value.trim();
        if (!code) {
          alert('Введите код подтверждения.');
          return;
        }
        const verifyUrl = "{{ url_for('verify_reset_password_code') }}";
        fetch(verifyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        })
        .then(async resp => {
          let data;
          try {
            data = await resp.json();
          } catch (_) {
            throw new Error('Непредвиденный ответ от сервера');
          }
          if (!resp.ok) {
            throw new Error(data.message || 'Ошибка проверки кода');
          }
          return data;
        })
        .then(data => {
          if (data.success) {
            alert('Код подтверждён. Введите новый пароль.');
            newPassGroup.style.display = '';
            saveBtn.style.display = '';
            verifyBtn.style.display = 'none';
          } else {
            alert(data.message || 'Неверный код.');
          }
        })
        .catch((err) => {
          alert(err.message || 'Ошибка проверки кода.');
        });
      });
    });
  </script>
{% endblock %}
